name: Pastport
options:
  bundleIdPrefix: com.anupamchugh
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "10"

# Package.swift is the single source for PastportKit, PastportUI and PastportMac.
packages:
  Pastport:
    path: .

targets:
  Pastport:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources/PastportBar
    dependencies:
      - package: Pastport
        product: PastportKit
      - package: Pastport
        product: PastportUI
      - package: Pastport
        product: PastportMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anupamchugh.Pastport
        PRODUCT_NAME: Pastport
        GENERATE_INFOPLIST_FILE: "YES"
        # Menu-bar utility that reads Safari history via Full Disk Access — must NOT
        # be App-Sandboxed (sandbox blocks History.db). Hardened runtime for notarization.
        ENABLE_HARDENED_RUNTIME: "YES"
        # Ad-hoc signing for local builds. Swap in a real Developer ID
        # (CODE_SIGN_STYLE: Automatic + DEVELOPMENT_TEAM) only for distribution.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pastport reads local photo activity only when you choose. Images stay on your Mac; screenshots contribute counts only."
        INFOPLIST_KEY_NSContactsUsageDescription: "Search or read contacts only after you enable Contacts and approve a tool request."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Read calendar events only after you enable Calendar and approve a tool request."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Read reminders only after you enable Reminders and approve a tool request."
        INFOPLIST_KEY_NSLocationUsageDescription: "Use location only after you enable Location and approve a tool request."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Use location only after you enable Location and approve a tool request."
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Search music or read the current track only after you enable Music and approve a tool request."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Read authorized health data only on supported platforms after you enable Health."
        INFOPLIST_KEY_LSUIElement: "YES"          # menu-bar only, no Dock icon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: Pastport.entitlements
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"

  # Native iPhone and iPad app. No Mac Catalyst, Designed-for-iPad or visionOS compatibility.
  PastportiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources/PastportiOS
    dependencies:
      - package: Pastport
        product: PastportKit
      - package: Pastport
        product: PastportUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anupamchugh.Pastport
        PRODUCT_NAME: Pastport
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        CODE_SIGN_ENTITLEMENTS: PastportiOS.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Pastport asks for Face ID before it reads your photo activity or shows a private item."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pastport reads local photo activity only when you choose. Images stay on this device; screenshots contribute counts only."
        INFOPLIST_KEY_NSContactsUsageDescription: "Search or read contacts only after you enable Contacts and approve a tool request."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Read calendar events only after you enable Calendar and approve a tool request."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Read reminders only after you enable Reminders and approve a tool request."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Use location only after you enable Location and approve a tool request."
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Search music or read the current track only after you enable Music and approve a tool request."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Read health data only after you enable Health and approve a tool request."
