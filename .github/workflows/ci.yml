name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The package needs the macOS and iOS 27 SDKs. The macos-26 image stops at Xcode 26.6; the xcode-27
    # label (actions/runner-images#14404) ships Xcode 27, whose own toolchain builds the package.
    runs-on: xcode-27
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Validate release scripts
        run: bash -n install.sh release-preflight.sh package-release.sh

      - name: Check for accidentally committed secrets
        shell: bash
        run: |
          if grep -rnEi '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|api[_-]?key[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{8,}|password[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']+)' \
            --exclude-dir=Tests --exclude-dir=.git --exclude-dir=.build --exclude-dir=.claude --exclude=README.md --exclude=LICENSE .; then
            echo "Potential secret pattern found" >&2
            exit 1
          fi
